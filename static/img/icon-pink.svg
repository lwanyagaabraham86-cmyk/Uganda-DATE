<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff18b6"/><stop offset=".48" stop-color="#ff0a72"/><stop offset="1" stop-color="#ed0037"/>
  </linearGradient>
  <radialGradient id="glow" cx=".17" cy=".11" r=".56">
    <stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".45" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pearl" x1=".08" y1=".04" x2=".9" y2=".96">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".32" stop-color="#fff9fc"/>
    <stop offset=".62" stop-color="#f9b8d0"/>
    <stop offset="1" stop-color="#ff6fa5"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-25%" width="160%" height="170%">
    <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#b40045" flood-opacity=".22"/>
  </filter>
</defs>

<rect width="512" height="512" rx="124" fill="url(#bg)"/>
<ellipse cx="122" cy="78" rx="190" ry="110" fill="url(#glow)"/>

<g filter="url(#shadow)">
  <!-- left embracing figure -->
  <path d="M108 197c0-61 45-101 98-101 46 0 81 24 99 62-18 18-31 40-39 65-14 42-25 83-60 111-55-38-98-79-98-137z" fill="url(#pearl)"/>
  <circle cx="207" cy="188" r="43" fill="url(#pearl)"/>
  <path d="M127 283c26-22 57-28 91-13 26 11 49 33 60 56-29-10-63-16-95-15-20 0-40-8-56-28z" fill="url(#pearl)"/>

  <!-- right embracing figure -->
  <path d="M405 197c0-61-45-101-98-101-46 0-81 24-99 62 18 18 31 40 39 65 14 42 25 83 60 111 55-38 98-79 98-137z" fill="url(#pearl)"/>
  <circle cx="305" cy="188" r="43" fill="url(#pearl)"/>
  <path d="M385 283c-26-22-57-28-91-13-26 11-49 33-60 56 29-10 63-16 95-15 20 0 40-8 56-28z" fill="url(#pearl)"/>

  <!-- overlapping lower arms forming the central heart -->
  <path d="M153 285c34 8 72 42 103 91 19-34 43-63 82-91-11 54-40 105-82 145-46-38-82-87-103-145z" fill="url(#pearl)"/>

  <!-- inner negative-space heart accent -->
  <path d="M256 248c-17-22-51-15-51 13 0 24 31 49 51 66 20-17 51-42 51-66 0-28-34-35-51-13z" fill="#ff0d68" opacity=".9"/>
</g>
</svg>