{% extends 'base.html' %}{% block title %}My Profile — Uganda Date{% endblock %}{% block content %}<main class="container"><div class="auth" style="margin-top:10px"><h1>Your profile</h1><form method="post"><div class="field"><label>Name</label><input name="name" value="{{user.name}}" required></div><div class="field"><label>City</label><input name="city" value="{{user.city}}"></div><div class="field"><label>Photo URL</label><input name="photo" value="{{user.photo}}"></div><div class="field"><label>About me</label><textarea name="bio">{{user.bio}}</textarea></div><button class="btn full">Save changes</button></form><div style="margin-top:25px;padding-top:20px;border-top:1px solid var(--line)"><b>Verification</b><p class="muted small">{% if user.verified %}✓ Your profile is verified.{% else %}Verification can be added by the admin after identity checks.{% endif %}</p></div></div></main>{% endblock %}
